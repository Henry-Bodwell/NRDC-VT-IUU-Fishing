site_name: doj_gov
base_url: https://www.justice.gov
search_url: https://www.justice.gov
selectors:
  search_input: input[name="query"]
  search_button: button[type="submit"]
  result_links: a.result-title-link
  result_title: h2.result-title-label
  result_snippet: div.result-desc
  next_page: a.usa-pagination__next-page
  detail_title: h1.page-title
  detail_content: div.field_body
  detail_date: div.node-date
  detail_author: null
  detail_tags: div.field__item
  custom: {}
rate_limit:
  requests_per_minute: 20
  delay_range:
  - 1
  - 5
  max_concurrent: 1
  respect_robots_txt: true
pagination:
  enabled: true
  next_button: a.usa-pagination__next-page
  max_pages: null
  pagination_type: button
  url_pattern: null
authentication:
  required: false
  auth_type: none
  login_url: null
  username_field: null
  password_field: null
  submit_button: null
  credentials_env_var: null
javascript_required: true
wait_for_selector: null
wait_for_timeout: 10000
headers: {}
cookies: []
metadata: {}
